name: Сборка и релиз

on:
  pull_request:
    branches: [main]
  # Любой push собирает приложение и сохраняет архив как artifact;
  # релиз публикуется только из main, пре-релиз — из pull request.
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Сборка
        shell: pwsh
        run: ./build.ps1

      - name: Публикация win-x64
        shell: pwsh
        run: ./publish.ps1 -Runtime win-x64

      - name: Версия и имя архива
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $tag = "pr-${{ github.event.pull_request.number }}"
            $title = "Пре-релиз PR #${{ github.event.pull_request.number }} (сборка ${{ github.run_number }})"
            $target = "${{ github.event.pull_request.head.sha }}"
          } else {
            $tag = "v1.0.${{ github.run_number }}"
            $title = "Сетевой планировщик $tag"
            $target = "${{ github.sha }}"
          }
          $zip = "NetworkPlanner-$tag-win-x64.zip"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "target=$target" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Архив
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath "${{ steps.meta.outputs.zip }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip }}
          path: ${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      # PR из форков получают токен только на чтение — пре-релиз для них не публикуется.
      - name: Пре-релиз для pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          # Новый коммит в PR заменяет предыдущий пре-релиз этого PR.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --cleanup-tag --yes }
          $global:LASTEXITCODE = 0
          gh release create $tag "${{ steps.meta.outputs.zip }}" `
            --prerelease `
            --target "${{ steps.meta.outputs.target }}" `
            --title "${{ steps.meta.outputs.title }}" `
            --notes "Тестовая сборка из PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.html_url }}`nКоммит: ${{ steps.meta.outputs.target }}"

      - name: Релиз
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.zip }}" `
            --target "${{ steps.meta.outputs.target }}" `
            --title "${{ steps.meta.outputs.title }}" `
            --generate-notes `
            --latest
